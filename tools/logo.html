<!doctype html>
<!-- Renders the IyaBolaji logo lockup. tools/export_logos.js screenshots it into assets/brand/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Modak&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .lockup { display: inline-flex; flex-direction: column; align-items: center; padding: 40px 56px 48px; }
  .word { font-family: "Modak", sans-serif; font-size: 300px; line-height: .74; padding-top: 70px; letter-spacing: -.012em; }
  .mark { width: 46%; height: auto; aspect-ratio: 404 / 88; margin-top: 10px; }
</style>
</head>
<body>
  <div class="lockup" id="lockup">
    <span class="word">iyabolaji</span>
    <svg class="mark" viewBox="0 0 404 88" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 76V34Q18 12 40 12H70M18 44H58"/>
        <rect x="92" y="12" width="104" height="64" rx="32"/>
        <rect x="216" y="12" width="104" height="64" rx="32"/>
        <path d="M342 12V76H354Q386 76 386 44Q386 12 354 12Z"/>
      </g>
    </svg>
  </div>
</body>
</html>
