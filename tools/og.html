<!doctype html>
<!-- Template for the link-preview images and the home-screen icon.
     tools/export_og.js fills it in for each page and screenshots it into assets/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Bagel+Fat+One&family=DM+Sans:wght@700&family=Modak&display=block" rel="stylesheet">
<style>
  :root { --red: #d9151d; --cream: #fdf0dc; --ink: #141211; --paper: #fffaf2; }
  html, body { margin: 0; }
  .tile { position: relative; overflow: hidden; color: var(--cream); background: var(--red) url("../assets/patterns/on-red.svg") 0 0 / 260px; }

  #card { width: 1200px; height: 630px; font-family: "DM Sans", sans-serif; }
  .word { position: absolute; left: 0; right: 0; top: 58px; margin: 0; text-align: center; font-family: "Modak"; font-weight: 400; font-size: 232px; line-height: .74; letter-spacing: -.012em; }
  .food { position: absolute; left: 236px; top: 258px; width: 300px; height: auto; color: var(--ink); }
  .title { position: absolute; left: 64px; top: 352px; margin: 0; font-family: "Archivo"; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: 56px; line-height: .92; }
  .title span { display: block; white-space: nowrap; }
  .title .ink { color: var(--ink); }
  .pill { position: absolute; left: 64px; bottom: 54px; margin: 0; padding: 14px 26px; border-radius: 999px; background: var(--cream); color: var(--ink); font-weight: 700; font-size: 24px; }
  .plate { position: absolute; right: 44px; bottom: -64px; width: 460px; height: 460px; box-sizing: border-box; padding: 16px; border-radius: 50%; object-fit: cover; background: var(--paper); box-shadow: 0 0 0 12px var(--red), 0 0 0 19px var(--paper), 0 30px 60px rgba(60, 0, 0, .4); }
  .plate.art { right: 14px; bottom: -96px; width: 530px; height: 530px; padding: 0; border-radius: 0; object-fit: contain; background: none; box-shadow: none; }
  .sticker { position: absolute; right: 40px; top: 246px; display: grid; place-content: center; width: 172px; height: 172px; margin: 0; border-radius: 50%; text-align: center; background: var(--cream); color: var(--ink); transform: rotate(-9deg); box-shadow: 0 14px 28px rgba(80, 5, 5, .3); }
  .sticker span { font-family: "Bagel Fat One"; font-size: 21px; line-height: 1.05; }
  .sticker strong { font-family: "Bagel Fat One"; font-weight: 400; font-size: 36px; line-height: 1.1; color: var(--red); }

  #icon { width: 180px; height: 180px; display: grid; place-content: center; justify-items: center; }
  #icon .mono { font-family: "Modak"; font-size: 104px; line-height: .74; padding-top: 18px; }
  #icon svg { width: 84px; height: auto; margin-top: 8px; color: var(--ink); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="food-mark" viewBox="0 0 404 88">
      <g fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 76V34Q18 12 40 12H70M18 44H58"/>
        <rect x="92" y="12" width="104" height="64" rx="32"/>
        <rect x="216" y="12" width="104" height="64" rx="32"/>
        <path d="M342 12V76H354Q386 76 386 44Q386 12 354 12Z"/>
      </g>
    </symbol>
  </svg>

  <div class="tile" id="card">
    <p class="word">iyabolaji</p>
    <svg class="food" viewBox="0 0 404 88"><use href="#food-mark"/></svg>
    <img class="plate" id="plate" src="../assets/img/turkey.jpg" alt="">
    <p class="sticker"><span id="sticker-top">Fried turkey</span><strong id="sticker-big">₦7,000</strong></p>
    <p class="title"><span id="line1">Smoky jollof.</span><span class="ink" id="line2">Mama's touch.</span></p>
    <p class="pill">3rd Ave Rd, Ipaja · Open till 11:59PM</p>
  </div>

  <div class="tile" id="icon">
    <span class="mono">iya</span>
    <svg viewBox="0 0 404 88"><use href="#food-mark"/></svg>
  </div>
</body>
</html>
