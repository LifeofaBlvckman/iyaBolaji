<script>
/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const oc = (u) => 1 - Math.pow(1 - u, 3);
const ic = (u) => u * u * u;
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rgb = (c) => `rgb(${c.map(Math.round).join(",")})`;
const mixC = (a, b, p) => a.map((v, i) => mix(v, b[i], p));
// Arrives exactly at t1 (still moving), then one small overshoot and settle.
function land(t, t0, t1, over = 0.06, settle = 0.2, e) {
  if (t <= t0) return 0;
  if (t < t1) { const u = (t - t0) / (t1 - t0); return e === "out" ? oc(u) : u * u * (2.2 - 1.2 * u); }
  const s = (t - t1) / settle;
  return s < 1 ? 1 + over * Math.sin(Math.PI * s) * (1 - s) * 1.6 : 1;
}
// Pop: 0 -> overshoot -> 1
function pop(t, t0, dur = 0.12, over = 0.25) {
  if (t <= t0) return 0;
  const u = (t - t0) / dur;
  if (u < 1) return oc(u) * (1 + over * Math.sin(Math.PI * u * 0.5));
  const s = (u - 1) / 1.2;
  return s < 1 ? 1 + over * Math.cos(Math.PI * s * 0.5) * (1 - s) : 1;
}
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
function blur(id, sx, sy) {
  const f = document.querySelector(`#${id} feGaussianBlur`);
  sx = Math.min(36, sx); sy = Math.min(36, sy);
  f.setAttribute("stdDeviation", `${sx.toFixed(2)} ${sy.toFixed(2)}`);
  return sx + sy > 0.4 ? `url(#${id})` : "none";
}
const SHUT = 1 / 120;   // half-frame shutter at 60 fps

/* ---------- colours & container keyframes ---------- */
const RED = [226, 44, 38], WHITE = [250, 250, 249], BLACK = [24, 23, 22], MAP = [221, 217, 212], KRAFT = [196, 151, 97];
// t0 = move starts, t1 = lands. cf = colour crossfade window. sh = top sheen strength.
const K = [
  { t0: -1, t1: 0, x: 546, y: 540, w: 200, h: 110, r: 55, c: RED, sh: .14 },
  { t0: 0.0, t1: 0.2, x: 690, y: 521, w: 618, h: 222, r: 50, c: RED, sh: .14, over: .07, settle: .25, arc: 5, e: "out" },
  { t0: 1.08, t1: 1.24, x: 388, y: 519, w: 651, h: 282, r: 46, c: WHITE, sh: .5, cf: [1.02, 1.42], cfe: "lin", over: .05 },
  { t0: 2.44, t1: 2.6, x: 540, y: 540, w: 780, h: 618, r: 42, c: WHITE, sh: .5, over: .05 },
  { t0: 3.62, t1: 3.86, x: 540, y: 540, w: 900, h: 162, r: 81, c: WHITE, sh: .5, over: .06 },
  { t0: 5.0, t1: 5.2, x: 540, y: 550, w: 672, h: 762, r: 40, c: WHITE, sh: .5, over: .05 },
  { t0: 8.45, t1: 8.62, x: 402, y: 548, w: 582, h: 660, r: 36, c: WHITE, sh: .5, over: .05 },
  { t0: 9.36, t1: 9.52, x: 540, y: 552, w: 600, h: 540, r: 40, c: WHITE, sh: .5, over: 0 },
  { t0: 9.52, t1: 9.72, x: 540, y: 550, w: 780, h: 717, r: 40, c: WHITE, sh: .5, over: .04, settle: .25 },
  { t0: 10.68, t1: 10.8, x: 540, y: 553, w: 789, h: 690, r: 40, c: BLACK, sh: .12, cf: [10.66, 10.8], over: 0 },
  { t0: 10.86, t1: 10.96, x: 540, y: 550, w: 858, h: 297, r: 38, c: BLACK, sh: .12, over: .07, settle: .22 },
  { t0: 11.66, t1: 11.86, x: 540, y: 540, w: 858, h: 780, r: 40, c: MAP, sh: 0, cf: [11.52, 11.7], over: .04 },
  { t0: 12.45, t1: 12.6, x: 540, y: 540, w: 858, h: 780, r: 40, c: KRAFT, sh: 0, cf: [12.45, 12.6], over: 0 },
  { t0: 12.6, t1: 12.78, x: 540, y: 440, w: 420, h: 621, r: 10, c: KRAFT, sh: 0, over: .05 },
  { t0: 13.94, t1: 14.04, x: 540, y: 443, w: 440, h: 630, r: 26, c: WHITE, sh: .5, cf: [13.95, 14.02], over: 0 },
  { t0: 14.04, t1: 14.2, x: 540, y: 540, w: 780, h: 780, r: 40, c: WHITE, sh: .5, over: .04 },
];
function boxAt(t) {
  let i = 0;
  while (i < K.length - 1 && t >= K[i + 1].t0) i++;
  if (i === 0) return { ...K[0], rot: 0 };
  const cur = K[i], prev = K[i - 1];
  const p = land(t, cur.t0, cur.t1, cur.over ?? .05, cur.settle ?? .2, cur.e);
  let c = K[0].c, sh = K[0].sh;
  for (const k of K.slice(1)) {
    const cf = k.cf || [k.t0, k.t1], u = seg(t, cf[0], cf[1]);
    if (u <= 0) break;
    const pc = k.cfe === "out" ? oc(u) : k.cfe === "lin" ? u : io(u);
    c = mixC(c, k.c, pc); sh = mix(sh, k.sh, pc);
  }
  return {
    x: mix(prev.x, cur.x, p), y: mix(prev.y, cur.y, p), w: mix(prev.w, cur.w, p), h: mix(prev.h, cur.h, p),
    r: mix(prev.r, cur.r, clamp(p)), c, sh,
    rot: (cur.arc || 0) * Math.sin(Math.PI * clamp(p)),
  };
}

/* ---------- carousel ---------- */

const SWIPES = [[6.0, 6.2, 0, 1], [6.3, 6.5, 1, 2], [6.68, 7.06, 2, 3], [7.18, 7.32, 3, 4], [7.55, 8.0, 4, 0]];
function stripPos(t) {
  let v = 0;
  for (const [a, b, f, to] of SWIPES) {
    if (t < a) break;
    if (t < b) return mix(f, to, io((t - a) / (b - a)));
    const s = (t - b) / 0.16;
    v = s < 1 ? to + (to - f) * 0.045 * Math.sin(Math.PI * s) * (1 - s) * 1.6 : to;
  }
  return v;
}

/* ---------- cursor: one continuous path (hotspot coordinates) ---------- */
const CP = [[0.3, 1150, 900], [0.4, 1043, 813], [0.5, 977, 715], [0.6, 902, 627], [0.7, 858, 605], [0.8, 822, 636], [0.9, 814, 680], [1.0, 792, 707],
  [1.1, 773, 711], [1.2, 741, 713], [1.3, 725, 727], [1.6, 611, 711], [1.7, 549, 676], [1.8, 523, 653], [1.842, 524, 652], [1.9, 580, 653],
  [2.0, 659, 653], [2.1, 747, 653], [2.2, 809, 645], [2.3, 844, 600], [2.4, 853, 559], [2.5, 865, 503], [2.6, 867, 451], [2.7, 836, 487],
  [2.8, 792, 553], [2.9, 752, 605], [3.0, 712, 632], [3.1, 691, 649], [3.172, 700, 652], [3.3, 750, 677], [3.5, 902, 694], [3.6, 963, 627],
  [3.7, 1030, 553], [3.8, 1030, 495], [3.9, 1035, 451], [4.0, 1007, 451], [4.1, 998, 451], [4.2, 985, 473], [4.3, 963, 495], [4.4, 932, 517],
  [4.5, 945, 535], [4.6, 938, 545], [4.726, 912, 552], [4.8, 822, 587], [4.9, 680, 570], [5.0, 522, 548], [5.1, 236, 460], [5.2, 227, 372],
  [5.3, 470, 328], [5.4, 747, 275], [5.5, 924, 292], [5.6, 932, 416], [5.7, 875, 570], [5.8, 850, 650], [5.96, 857, 655], [6.12, 640, 665],
  [6.28, 850, 655], [6.44, 640, 660], [6.64, 855, 652], [6.85, 600, 660], [7.15, 835, 650], [7.3, 650, 655], [7.45, 760, 640], [7.6, 800, 636],
  [7.7, 756, 636], [7.8, 712, 636], [7.9, 668, 640], [8.0, 646, 649], [8.1, 624, 665], [8.22, 650, 650], [8.3, 725, 614], [8.4, 804, 539],
  [8.5, 875, 495], [8.6, 902, 504], [8.7, 888, 570], [8.8, 858, 689], [8.9, 814, 764], [9.001, 822, 773], [9.1, 858, 720], [9.2, 910, 610],
  [9.3, 954, 504], [9.4, 998, 416], [9.5, 998, 372], [9.6, 977, 389], [9.7, 932, 420], [9.8, 888, 477], [9.9, 836, 530], [10.0, 800, 574],
  [10.1, 747, 632], [10.2, 703, 685], [10.3, 659, 742], [10.4, 646, 786], [10.48, 652, 800], [10.6, 765, 861], [10.7, 866, 870], [10.8, 977, 892],
  [10.9, 1043, 918], [11.0, 1140, 980]];
const CLICKS = [1.842, 3.172, 4.726, 8.22, 9.001, 10.48];
const DRAGS = [[5.96, 6.12], [6.28, 6.44], [6.64, 6.85], [7.15, 7.3]];
function cr(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return .5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function cursorAt(t) {
  if (t <= CP[0][0]) return [CP[0][1], CP[0][2]];
  for (let i = 0; i < CP.length - 1; i++) {
    if (t > CP[i + 1][0]) continue;
    const u = (t - CP[i][0]) / (CP[i + 1][0] - CP[i][0]);
    const q = (j) => CP[clamp(j, 0, CP.length - 1)];
    return [cr(q(i - 1)[1], q(i)[1], q(i + 1)[1], q(i + 2)[1], u), cr(q(i - 1)[2], q(i)[2], q(i + 1)[2], q(i + 2)[2], u)];
  }
  const l = CP[CP.length - 1]; return [l[1], l[2]];
}

/* ---------- build the DOM ---------- */
const stage = document.getElementById("stage"), box = document.getElementById("box"), inner = document.getElementById("inner"),
      over = document.getElementById("over"), fx = document.getElementById("stagefx"), side = document.getElementById("side"),
      hand = document.getElementById("hand"), fade = document.getElementById("fade");

// Wavy text: one span per letter. lines: [{s, x, y (centre), size, color, red: [a,b], t0, step}]
function makeText(parent, s, x, y, size, color, opts = {}) {
  const el = document.createElement("div");
  el.className = "t"; el.style.fontSize = size + "px"; el.style.left = x + "px"; el.style.top = y - size * 0.5 + "px";
  if (opts.center) el.style.transform = "translateX(-50%)";
  const spans = [...s].map((ch, i) => {
    const sp = document.createElement("span"); sp.textContent = ch;
    sp.style.color = opts.red && i >= opts.red[0] && i < opts.red[1] ? (opts.redColor || "#d9151d") : color;
    el.append(sp); return sp;
  });
  parent.append(el);
  return { el, spans, size };
}
function waveLetters(T, t, times, opts = {}) {
  T.spans.forEach((sp, i) => {
    const ti = times[i];
    if (t < ti) { sp.style.opacity = 0; return; }
    const q = land(t, ti, ti + (opts.dur || 0.1), 0.09 + 0.06 * hash(i + 3), 0.1 + 0.05 * hash(i * 7));
    const a = 1 - q;
    const amp = (opts.amp || 1) * T.size / 54;
    const wave = Math.sin(i * 1.1 + t * 18) * 16 * clamp(a) * amp;
    sp.style.opacity = clamp((t - ti) / 0.04);
    sp.style.transform = `translateY(${a * -46 * amp + wave}px) rotate(${a * (hash(i + 11) * 30 - 15)}deg) scale(${1 + a * 0.7})`;
    if (opts.grey) sp.style.color = q < 0.9 ? "#9b968f" : "";
  });
}
function scatter(T, t, t0) {
  T.spans.forEach((sp, i) => {
    const s0 = t0 + hash(i * 5) * 0.05, u = seg(t, s0, s0 + 0.1);
    if (u <= 0) return;
    sp.style.opacity = 1 - u;
    sp.style.transform = `translate(${(hash(i + 2) - .5) * 60 * u}px, ${(hash(i + 9) - .5) * 70 * u}px) rotate(${(hash(i) - .5) * 60 * u}deg) scale(${1 + .4 * u})`;
  });
}

// Scene: product card + carousel (card 0 lives in the box; the rest are separate cards)

// Measure text so lines can be centred and the credit revealed letter by letter.

/* ---------- render ---------- */
const show = (el, on) => { el.style.display = on ? "" : "none"; };
window.render = function (t) {
  if (!measured) measure();
  // Container
  let g = boxAt(t);
  const carousel = t >= 5.7 && t < 8.45;
  const sp = carousel ? stripPos(t) : 0;
  const spv = carousel ? (stripPos(t + 1 / 240) - stripPos(t - 1 / 240)) * 120 * PITCH : 0;
  if (carousel) g = { ...g, x: g.x - sp * PITCH };
  const ga = boxAt(t - 1 / 240), gb = boxAt(t + 1 / 240);
  const vx = carousel ? spv : (gb.x - ga.x) * 120, vy = (gb.y - ga.y) * 120;

  const bf = blur("mb0", Math.abs(vx) * SHUT / 2.2, Math.abs(vy) * SHUT / 2.2);
  for (const el of [box, over]) {

  }

  });

  // Me bubble
  show(me, t >= 0.08 && t < 1.4);
  if (t >= 0.08 && t < 1.4) {
    const tm1 = me1.spans.map((_, i) => 0.07 + i * 0.014), tm2 = me2.spans.map((_, i) => 0.2 + i * 0.016);
    if (t < 1.1) { waveLetters(me1, t, tm1); waveLetters(me2, t, tm2); } else { scatter(me1, t, 1.1); scatter(me2, t, 1.12); }
    meLbl.style.left = g.w - 50 + "px"; meLbl.style.top = "-36px";
    meLbl.style.opacity = seg(t, 0.26, 0.34) * (1 - seg(t, 1.06, 1.14));
    const e = pop(t, 0.6, 0.11, 0.3);
    place(meEmo, g.w - 90, g.h - 72, e);
    meEmo.style.opacity = clamp(e * 4) * (1 - 0.7 * seg(t, 1.08, 1.2)) * (1 - seg(t, 1.28, 1.38));
  }
  // Friend bubble
  show(fr, t >= 1.18 && t < 2.42);
  if (t >= 1.18 && t < 2.42) {
    let n = 0;
    frL.forEach((L) => { waveLetters(L, t, L.spans.map(() => 1.19 + (n++) * 0.0095)); });
    frLbl.style.left = "30px"; frLbl.style.top = "-37px"; frLbl.style.opacity = seg(t, 1.18, 1.26);
    place(frEmo, g.w - 90, g.h - 69, pop(t, 1.47, 0.1, 0.3));
    const out = seg(t, 2.22, 2.38);
    fr.style.opacity = 1 - out; fr.style.filter = out > 0 ? `grayscale(1) brightness(${1 + out * 1.4})` : "";
  }
  // Where are you?
  show(wh, t >= 2.6 && t < 3.68);
  if (t >= 2.6 && t < 3.68) {
    waveLetters(whT, t, whT.spans.map((_, i) => 2.64 + i * 0.016), { grey: true });
    whItems.forEach((it, i) => {
      const s0 = [2.96, 3.02, 3.07, 3.13][i], u = oc(seg(t, s0, s0 + 0.12));
      it.style.opacity = u; it.style.transform = `translateX(${(1 - u) * -30}px)`;
      it.style.color = i === 2 && t >= 3.2 ? "#fff" : u < 1 ? "#9b968f" : "#151311";
    });
    const b = oc(seg(t, 3.17, 3.3));
    whBar.style.transform = `scaleX(${b})`; whBar.style.opacity = b > 0 ? 1 : 0;
    whBar.style.webkitMaskImage = b < 1 ? "linear-gradient(90deg,#000 85%,transparent)" : "none";
    wh.style.opacity = 1 - seg(t, 3.55, 3.66);
  }
  // Search
  show(se, t >= 3.86 && t < 4.98);
  if (t >= 3.86 && t < 4.98) {
    let n = 0; TAPS.forEach((tp, i) => { if (t >= tp) n = TYPED[i]; });
    seTxt.firstElementChild.textContent = QUERY.slice(0, n);
    const grow = t < 4.05 ? 0.59 * pop(t, 3.9, 0.1, 0.2) : mix(0.59, 1, land(t, 4.04, 4.13, 0.08, 0.15));
    const press = Math.sin(Math.PI * seg(t, 4.726, 4.886));
    seBtn.style.transform = `translate(${819 - 63}px, ${81 - 63}px) scale(${grow * (1 - 0.1 * press)})`;
    se.style.opacity = 1 - seg(t, 4.84, 4.95);
  }
  // Product card (card 0 in the box) and the rest of the carousel
  const pcOn = t >= 5.16 && t < 9.47;
  show(pc, pcOn);
  if (pcOn) {
    const s = g.w / 672;
    pc.style.transform = `scale(${s})`;
    const ip = oc(seg(t, 5.18, 5.3));
    pcPh.style.opacity = ip; pcPh.style.transform = `scale(${1.06 - 0.06 * ip})`;
    pcTx.forEach((e, i) => { const u = oc(seg(t, 5.27 + i * 0.03, 5.4 + i * 0.03)); e.style.opacity = u; e.style.transform = `translateY(${(1 - u) * 14}px)`; });
    place(pcFire, 586, 86, pop(t, 5.36, 0.12, 0.3));

  }
  const cbf = blur("mb1", Math.abs(spv) * SHUT / 2.2, 0);
  others.forEach((c, j) => {

    side.style.transform = `translate(${x - 202.5}px, ${y - 235.5}px) rotate(${(1 - clamp(p)) * 6}deg) scale(${(0.4 + 0.6 * p) * (1 - 0.03 * press) * (1 - 0.15 * m)})`;
    side.style.opacity = clamp(p * 4) * (1 - m);

  }
  // Your order

    odRows.forEach((r, i) => { const u = oc(seg(t, [10.04, 10.1, 10.16][i], [10.04, 10.1, 10.16][i] + 0.12)); r.style.opacity = u; r.style.transform = `translateY(${(1 - u) * 16}px)`; });
    const bp = pop(t, 9.98, 0.12, 0.12), press = Math.sin(Math.PI * seg(t, 10.48, 10.64));

    odBtn.style.opacity = clamp(bp * 3);

    owSub.style.opacity = seg(t, 11.08, 11.18); owBar.style.opacity = seg(t, 11.08, 11.16);
    owBar.firstElementChild.style.width = 750 * Math.pow(seg(t, 11.1, 11.7), 1.7) + "px";
    ow.style.opacity = 1 - seg(t, 11.52, 11.66);

  // Map with the rider

  if (t >= 11.66 && t < 12.6) {
    mp.style.top = (g.h - 780) / 2 + "px";

    mapLbl.style.opacity = seg(t, 11.88, 11.98);
    const u = io(seg(t, 11.95, 12.45)), L = route.getTotalLength(), pt = route.getPointAtLength(L * u);
    route.style.strokeDasharray = `${L} ${L}`; route.style.strokeDashoffset = L * (1 - u);
    route.style.opacity = t >= 11.95 ? 1 : 0;

  }
  // Bag with the logo, then the stars
  const bagOn = t >= 12.55 && t < 14.0;

  if (bagOn) {

  stars.forEach((s, i) => {

    if (!on) return;
    const fly = oc(seg(t, 13.86 + i * 0.012, 14.02 + i * 0.012));
    const sc = pop(t, STAR_T[i], 0.1, 0.45);
    s.style.transform = `translate(${STAR_X[i] - 31 - fly * (110 + i * 45)}px, ${852 - 31 + fly * (330 - i * 25)}px) rotate(${-fly * 50}deg) scale(${sc * (1 - 0.3 * fly)})`;
    s.style.opacity = 1 - fly;
    s.style.filter = fly > 0 && fly < 1 ? blur("mb" + (3 + Math.min(i, 4)), 0, 0) : "none";
  });
  // Photo card and the bites
  const phOn = t >= 13.9 && t < 15.06;
  show(ph, phOn);
  if (phOn) { ph.style.width = g.w + "px"; ph.style.height = g.h + "px"; ph.style.opacity = seg(t, 13.95, 14.02); }

    bites[i].style.zIndex = 2;

  bigBite.forEach((b, i) => {

    const r = 760 * io(u) * [1, 1.1, 1.2][i] + 4;
    Object.assign(b.style, { width: 2 * r + "px", height: 2 * r + "px", transform: `translate(${970 - r}px, ${550 - r}px)`, zIndex: 3 });
  });
  // Closing line: "The pepper is / in every bite 😋"
  show(tx, t >= 15.06 && t < 16.08);
  if (t >= 15.06 && t < 16.08) {
    const wordTimes = (T, starts) => { const out = []; let w = 0, k = 0; [...T.spans].forEach((sp) => { if (sp.textContent === " ") { w++; k = 0; out.push(starts[w - 1]); return; } out.push(starts[w] + (k++) * 0.018); }); return out; };
    waveLetters(tx1, t, wordTimes(tx1, [15.08, 15.12, 15.2]), { amp: 1.1 });
    waveLetters(tx2, t, wordTimes(tx2, [15.29, 15.37, 15.47]), { amp: 1.1 });
    place(txEmo, 540 + tx2W / 2 + 105, 595, pop(t, 15.18, 0.12, 0.3));
    const z = io(seg(t, 15.94, 16.05));
    tx.style.transform = `scale(${1 - 0.82 * z})`; tx.style.opacity = 1 - seg(t, 15.98, 16.06);
    tx.style.filter = z > 0 ? blur("mb7", 10 * z, 4 * z) : "none";
  }
  // Logo: zooms in, slides left and shrinks, rides the typing, leaves
  show(logo, t >= 16.02 && t < 18.2);
  if (t >= 16.02 && t < 18.2) {
    const zin = land(t, 16.02, 16.17, 0.12, 0.2);
    let x = 540, w = 780 * mix(0.25, 1, zin);
    const sl = land(t, 16.85, 17.0, 0.06, 0.18);
    x = mix(540, 170, sl); w = mix(w, 170, clamp(sl));
    const ride = io(seg(t, 17.3, 17.9));
    const tLeft = 540 - credW / 2;
    const xEnd = tLeft + credW + 14 + 85;
    x = mix(x, xEnd, ride) + 90 * oc(seg(t, 18.03, 18.18));
    const lb = blur("mb6", Math.abs(t > 16.84 && t < 17.05 ? 2600 * Math.sin(Math.PI * seg(t, 16.85, 17.0)) : 0) * SHUT / 2.2 + (zin < 0.9 ? 6 * (1 - zin) : 0), zin < 0.9 ? 6 * (1 - zin) : 0);
    logo.style.width = w + "px";
    logo.style.transform = `translate(${x - w / 2}px, ${540 - w * 787 / 2345 / 2}px)`;
    logo.style.filter = lb;
    logo.style.opacity = clamp((t - 16.02) / 0.05) * (1 - seg(t, 18.04, 18.18));
    // Credit letters appear as the logo's left edge passes them
    const edge = x - w / 2 - 6 - tLeft;
    cred.spans.forEach((sp, i) => { const on = t >= 17.3 && credX[i] < edge; sp.style.opacity = on ? 1 : 0; });
  }
  show(cred.el, t >= 17.3);
  if (t >= 18.2) cred.spans.forEach((sp) => (sp.style.opacity = 1));

  // Cursor
  const [cx, cy] = cursorAt(t);
  let cs = 1;
  for (const c of CLICKS) { const d = (t - c + 0.02) / 0.12; if (d > 0 && d < 1) cs = 1 - 0.14 * Math.sin(Math.PI * d); }
  for (const [a, b] of DRAGS) if (t > a - 0.02 && t < b + 0.02) cs = 0.88;
  hand.style.transform = `translate(${cx - 14}px, ${cy - 9}px) scale(${cs})`;
  show(hand, t >= 0.3 && t < 11.05);

  fade.style.opacity = seg(t, 19.45, 19.95);
};
